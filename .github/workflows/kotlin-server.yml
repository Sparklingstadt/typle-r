name: Kotlin backend

# Tests the Kotlin backend (server-kotlin), the same API as the Go typle-web for local development, and runs every
# end-to-end test against it. It is separate from ci.yml: the Kotlin backend is never released or deployed, so a failure
# here does not hold back a release, and is fixed in a later PR. Like the iPad and Android workflows it runs on pull
# requests and by hand only, not again on the push to main. It is not filtered by path, so that a change to the app or to
# the Go backend that the Kotlin one no longer matches is found.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://typle:ci-only-password@127.0.0.1:5432/typle
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: typle
          POSTGRES_DB: typle
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U typle -d typle"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: npm ci
      - run: npm run db:migrate
      # The store tests run against the tables db:migrate just made.
      - name: Test and build the Kotlin backend
        working-directory: server-kotlin
        env:
          TYPLE_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: ./gradlew test installDist
      - run: npm run build
      # The browser download is cached per Playwright version; the system packages it needs are installed every run.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: End-to-end tests against the Kotlin backend
        env:
          TYPLE_BACKEND: kotlin
        run: npm run test:e2e
