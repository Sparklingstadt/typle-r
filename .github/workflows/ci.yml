name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check read-only access to merge settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release.cjs settings
      - name: Check release policy on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release.cjs policy

  verify:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://typle:ci-only-password@127.0.0.1:5432/typle
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: typle
          POSTGRES_DB: typle
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U typle -d typle"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        id: node
        with:
          node-version: '24'
          cache: npm
      - name: Test release safety checks
        run: node --test scripts/ci/release.test.cjs
      # node_modules is restored whole when the lockfile and the Node version are unchanged; otherwise npm ci installs
      # it from the npm cache as before.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run db:migrate
      # The Go API (server/) is tested against the tables db:migrate just made. '1.25' is the newest
      # 1.25.x release, which satisfies go.mod.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Check Go API
        env:
          TYPLE_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "Run gofmt -w on: $unformatted"; exit 1; }
          go vet ./...
          go test ./...
      - run: npm run typecheck
      # The same tests as npm test, with the coverage of src in the log. There is no threshold yet.
      - run: npm run test:coverage
      - run: npm run lint
      # Next.js reuses its build cache across runs; a key that misses the sources still restores the newest cache for
      # the same lockfile, and next build only reuses what is still valid.
      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.mjs', 'postcss.config.mjs', 'tsconfig.json') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      # The API documentation (api-docs/) is its own npm project, built and checked here and published by hand with
      # docs-deploy.yml.
      - name: Build API documentation
        working-directory: api-docs
        run: |
          npm ci
          npm run docs:build
          npm run docs:check
      # The browser download is cached per Playwright version; the system packages it needs are installed every run.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e

  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Publish release for verified commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release.cjs publish

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
    # VERCEL_TOKEN is given only to the steps that need it, never to the CLI's installation.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 60.1.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify published release and deployment credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID'; exit 1; }
          node scripts/ci/release.cjs check
      # The pinned CLI is kept in its own prefix and cached by version. Only main-branch runs deploy, and they only
      # restore caches saved on main, so a pull request cannot supply the CLI that receives the token. A global install
      # has no lockfile, so the CLI's dependencies' install scripts are not run.
      - name: Cache pinned Vercel CLI
        id: vercel-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.vercel-cli
          key: vercel-cli-${{ runner.os }}-node24-${{ env.VERCEL_CLI_VERSION }}-ignore-scripts
      - name: Install pinned Vercel CLI
        if: steps.vercel-cache.outputs.cache-hit != 'true'
        run: npm install --global --ignore-scripts --prefix "$HOME/.vercel-cli" "vercel@$VERCEL_CLI_VERSION"
      - name: Use pinned Vercel CLI
        run: |
          echo "$HOME/.vercel-cli/bin" >> "$GITHUB_PATH"
          "$HOME/.vercel-cli/bin/vercel" --version
      - name: Recheck release before production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node scripts/ci/release.cjs check
      - name: Deploy released commit
        id: deploy
        env:
          SOURCE_SHA: ${{ needs.release.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --meta "githubCommitSha=$SOURCE_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf 'Production deployment: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
      # The checks below must see the new deployment. vercel deploy --prod can return while the production domain still
      # points at the previous one, which answers the paths both have alike, so wait until Vercel resolves the domain to
      # the deployment just made. The page itself names no deployment: Next.js writes data-dpl-id only with Skew
      # Protection, which this project does not have enabled.
      - name: Wait for production to serve the new deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          expected=${DEPLOYMENT_URL#https://}
          test -n "$expected" || { echo 'No deployment URL from vercel deploy'; exit 1; }
          for attempt in $(seq 1 60); do
            served=$(curl --silent --show-error --max-time 30 --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/typle-r-six.vercel.app?teamId=$VERCEL_ORG_ID" | jq -r '.url // empty' || true)
            if [ "$served" = "$expected" ]; then
              echo "Production serves $served after $attempt checks"
              exit 0
            fi
            sleep 5
          done
          echo "Production still serves ${served:-an unknown deployment} five minutes after deploying $expected"
          exit 1
      # The site is served at typle.sparklingstadt.com (SITE_URL and AUTH_URL). The Vercel domain typle-r-six.vercel.app
      # stays for the iPad and Mac apps, which call /api/* there: vercel.json sends its pages, and the start of a login,
      # to the custom domain, so that the OAuth cookie and the callback share one host.
      - name: Check production home and authentication boundary
        env:
          SITE: https://typle.sparklingstadt.com
          LEGACY: https://typle-r-six.vercel.app
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 "$SITE/home" > /dev/null
          redirect=$(curl --silent --show-error --retry 3 --max-time 60 --output /dev/null --write-out '%{http_code} %{redirect_url}' "$LEGACY/home?from=ci")
          test "$redirect" = "308 $SITE/home?from=ci" || { echo "Expected the Vercel domain to send pages to $SITE with HTTP 308, got $redirect"; exit 1; }
          for origin in "$SITE" "$LEGACY"; do
            curl --fail --silent --show-error --retry 3 --max-time 60 "$origin/api/health" > /dev/null
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 60 "$origin/api/workspace")
            test "$status" = 401 || { echo "Expected anonymous API HTTP 401 at $origin, got $status"; exit 1; }
          done
          body=$(curl --fail --silent --show-error --retry 3 --max-time 60 "$SITE/api/auth/session")
          echo "$body" | jq -e '.user == null and (.providers | type == "array") and (.providers | index("github")) != null' > /dev/null || { echo "Expected anonymous session with a null user and a providers array containing github, got $body"; exit 1; }
          signin=$(curl --silent --show-error --retry 3 --max-time 60 --output "$RUNNER_TEMP/signin-response" --write-out '%{http_code} %{redirect_url}' "$SITE/api/auth/signin")
          status=${signin%% *}
          location=${signin#* }
          test "$status" = 302 || { echo "Expected sign-in HTTP 302, got $status"; exit 1; }
          case "$location" in
            "https://github.com/login/oauth/authorize?"*redirect_uri=https%3A%2F%2Ftyple.sparklingstadt.com%2Fapi%2Fauth%2Fcallback%2Fgithub*) ;;
            *) echo "Expected sign-in to redirect to GitHub with the production callback, got $location"; exit 1 ;;
          esac
          # An app's login starts at the Vercel domain and must move to the custom domain with its query intact.
          signin=$(curl --silent --show-error --retry 3 --max-time 60 --output /dev/null --write-out '%{http_code} %{redirect_url}' "$LEGACY/api/auth/signin?client=ipad&returnTo=%2Fplay")
          test "$signin" = "307 $SITE/api/auth/signin?client=ipad&returnTo=%2Fplay" || { echo "Expected the Vercel domain to send sign-in to $SITE with HTTP 307, got $signin"; exit 1; }
          # The iPad app's token exchange is deployed at the Vercel domain it calls, and refuses a request without a valid code.
          status=$(curl --silent --show-error --retry 3 --max-time 60 --request POST --header 'Content-Type: application/json' --data '{}' --output "$RUNNER_TEMP/token-response" --write-out '%{http_code}' "$LEGACY/api/auth/token")
          body=$(cat "$RUNNER_TEMP/token-response")
          test "$status $body" = '400 {"error":"loginFailed"}' || { echo "Expected the token exchange to answer 400 loginFailed, got $status $body"; exit 1; }
