name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check read-only access to squash settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release.cjs settings
      - name: Check release policy on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release.cjs policy

  verify:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://typle:ci-only-password@127.0.0.1:5432/typle
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: typle
          POSTGRES_DB: typle
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U typle -d typle"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Test release safety checks
        run: node --test scripts/ci/release.test.cjs
      - run: npm ci
      - run: npm run db:migrate
      # The Go API (server/) is tested against the tables db:migrate just made. '1.25' is the newest
      # 1.25.x release, which satisfies go.mod.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Check Go API
        env:
          TYPLE_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "Run gofmt -w on: $unformatted"; exit 1; }
          go vet ./...
          go test ./...
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # The browser download is cached per Playwright version; the system packages it needs are installed every run.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e

  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Publish release for verified commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release.cjs publish

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
    # VERCEL_TOKEN is given only to the steps that need it, never to the CLI's installation.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 60.1.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify published release and deployment credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID'; exit 1; }
          node scripts/ci/release.cjs check
      # The pinned CLI is kept in its own prefix and cached by version. Only main-branch runs deploy, and they only
      # restore caches saved on main, so a pull request cannot supply the CLI that receives the token. A global install
      # has no lockfile, so the CLI's dependencies' install scripts are not run.
      - name: Cache pinned Vercel CLI
        id: vercel-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.vercel-cli
          key: vercel-cli-${{ runner.os }}-node24-${{ env.VERCEL_CLI_VERSION }}-ignore-scripts
      - name: Install pinned Vercel CLI
        if: steps.vercel-cache.outputs.cache-hit != 'true'
        run: npm install --global --ignore-scripts --prefix "$HOME/.vercel-cli" "vercel@$VERCEL_CLI_VERSION"
      - name: Use pinned Vercel CLI
        run: |
          echo "$HOME/.vercel-cli/bin" >> "$GITHUB_PATH"
          "$HOME/.vercel-cli/bin/vercel" --version
      - name: Recheck release before production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node scripts/ci/release.cjs check
      - name: Deploy released commit
        id: deploy
        env:
          SOURCE_SHA: ${{ needs.release.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --meta "githubCommitSha=$SOURCE_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf 'Production deployment: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Check production home and authentication boundary
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 https://typle-r-six.vercel.app/home > /dev/null
          curl --fail --silent --show-error --retry 3 --max-time 60 https://typle-r-six.vercel.app/api/health > /dev/null
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 60 https://typle-r-six.vercel.app/api/workspace)
          test "$status" = 401 || { echo "Expected anonymous API HTTP 401, got $status"; exit 1; }
