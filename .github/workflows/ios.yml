name: iPad app

# Builds the SwiftUI app in ios/, tests its shared rules and captures screenshots of every page. It is separate from
# ci.yml: the iPad app is not released or deployed by it, and macOS runners only start for pull requests that change
# ios/ and when started by hand (workflow_dispatch), not again on the push to main: their minutes count ten times.
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/plugins/packs/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show Xcode
        run: xcodebuild -version
      - name: Test TypleCore
        working-directory: ios/TypleCore
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      # Also builds TypleUITests, which only turns the simulator for the screenshots.
      - name: Build for the iPad simulator
        working-directory: ios
        run: |
          xcodebuild build-for-testing -project Typle.xcodeproj -scheme Typle \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tee build.log
          exit "${PIPESTATUS[0]}"
      - name: Show build errors
        if: failure()
        working-directory: ios
        run: |
          grep -E 'error:|warning: .*(Sendable|actor)' build.log | sort -u | head -100 || true
      # Each page with the sample data of `-TypleDemo` (DemoData.swift), to compare with the web app's pages.
      - name: Capture screenshots
        working-directory: ios
        run: |
          set -euo pipefail
          app=build/Build/Products/Debug-iphonesimulator/Typle.app
          bundle=io.github.sparklingstadt.typle
          xctestrun=$(ls build/Build/Products/*.xctestrun | head -1)
          mkdir -p screenshots
          # iPadOS ignores an app's orientation requests when it supports Split View, and simctl cannot rotate a
          # device, so a UI test turns it (ios/TypleUITests/OrientationTests.swift).
          turn() { # device-udid Landscape|Portrait
            xcodebuild test-without-building -xctestrun "$xctestrun" -destination "id=$1" \
              -only-testing:"TypleUITests/OrientationTests/test$2" >"turn-$2.log" 2>&1 \
              || { echo "::warning::Could not turn the simulator to $2"; tail -30 "turn-$2.log"; }
          }
          capture() { # device-udid prefix language appearance route [extra args...]
            local udid=$1 prefix=$2 language=$3 appearance=$4 route=$5; shift 5
            xcrun simctl terminate "$udid" "$bundle" >/dev/null 2>&1 || true
            xcrun simctl ui "$udid" appearance "$appearance"
            xcrun simctl launch "$udid" "$bundle" -TypleDemo YES -TypleRoute "$route" \
              -typle-r:language "$language" "$@" >/dev/null
            sleep 6
            xcrun simctl io "$udid" screenshot "screenshots/$prefix-$route.png" >/dev/null
          }
          # The 11-inch Air is 1180×820pt in landscape like the web captures; the 13-inch Pro is wide enough for the sidebar.
          for name in 'iPad Air 11-inch' 'iPad Pro 13-inch'; do
            udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r in json.load(sys.stdin)['devices'].values() for d in r if d['name'].startswith(sys.argv[1])))" "$name")
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$udid" "$app"
            turn "$udid" Landscape
            if [[ $name == *Air* ]]; then
              for route in home practice records rankings lists createList editList general devices; do
                capture "$udid" air ja light "$route"
              done
              capture "$udid" air-typing ja light practice -TypleTyping hogefx
              capture "$udid" air-result ja light practice -TypleTyping hogefoobar
              capture "$udid" air-detail ja light rankings -TypleRankingsList sample-1
              capture "$udid" air-dark ja dark practice
              capture "$udid" air-en en light practice
              turn "$udid" Portrait
              capture "$udid" air-portrait ja light practice
            else
              capture "$udid" pro ja light practice
              capture "$udid" pro ja light lists
            fi
            xcrun simctl shutdown "$udid"
          done
          ls -l screenshots
      # The artifact storage is not reachable from every reviewer's environment, so the screenshots are also printed
      # into the log as small JPEGs (base64, one line each, after "SCREENSHOT <name>").
      - name: Print screenshots
        if: always()
        working-directory: ios
        run: |
          mkdir -p small
          for file in screenshots/*.png; do
            [ -e "$file" ] || continue
            name=$(basename "$file" .png)
            sips -s format jpeg -s formatOptions 55 -Z 1400 "$file" --out "small/$name.jpg" >/dev/null
            echo "SCREENSHOT $name $(base64 -i "small/$name.jpg" | tr -d '\n')"
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipad-screenshots
          path: ios/screenshots
          retention-days: 14
          if-no-files-found: ignore
