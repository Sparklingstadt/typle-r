name: iPad app

# Builds the SwiftUI app in ios/, tests its shared rules and captures screenshots of every page. It is separate from
# ci.yml: the iPad app is not released or deployed by it, and macOS runners only start when ios/ changes.
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/plugins/packs/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'src/plugins/packs/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show Xcode
        run: xcodebuild -version
      - name: Test TypleCore
        working-directory: ios/TypleCore
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for the iPad simulator
        working-directory: ios
        run: |
          xcodebuild build -project Typle.xcodeproj -scheme Typle \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tee build.log
          exit "${PIPESTATUS[0]}"
      - name: Show build errors
        if: failure()
        working-directory: ios
        run: |
          grep -E 'error:|warning: .*(Sendable|actor)' build.log | sort -u | head -100 || true
      # Each page with the sample data of `-TypleDemo` (DemoData.swift), to compare with the web app's pages.
      - name: Capture screenshots
        working-directory: ios
        run: |
          set -euo pipefail
          app=build/Build/Products/Debug-iphonesimulator/Typle.app
          bundle=io.github.sparklingstadt.typle
          mkdir -p screenshots
          capture() { # device-udid prefix orientation language appearance route [extra args...]
            local udid=$1 prefix=$2 orientation=$3 language=$4 appearance=$5 route=$6; shift 6
            xcrun simctl terminate "$udid" "$bundle" >/dev/null 2>&1 || true
            xcrun simctl ui "$udid" appearance "$appearance"
            xcrun simctl launch "$udid" "$bundle" -TypleDemo YES -TypleRoute "$route" -TypleOrientation "$orientation" \
              -typle-r:language "$language" "$@" >/dev/null
            sleep 6
            xcrun simctl io "$udid" screenshot "screenshots/$prefix-$route.png" >/dev/null
          }
          # The 11-inch Air is 1180×820pt in landscape like the web captures; the 13-inch Pro is wide enough for the sidebar.
          for name in 'iPad Air 11-inch' 'iPad Pro 13-inch'; do
            udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r in json.load(sys.stdin)['devices'].values() for d in r if d['name'].startswith(sys.argv[1])))" "$name")
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$udid" "$app"
            if [[ $name == *Air* ]]; then
              for route in home practice records rankings lists createList editList general devices; do
                capture "$udid" air landscape ja light "$route"
              done
              capture "$udid" air-typing landscape ja light practice -TypleTyping hogefx
              capture "$udid" air-result landscape ja light practice -TypleTyping hogefoobar
              capture "$udid" air-detail landscape ja light rankings -TypleRankingsList sample-1
              capture "$udid" air-dark landscape ja dark practice
              capture "$udid" air-en landscape en light practice
              capture "$udid" air-portrait portrait ja light practice
            else
              capture "$udid" pro landscape ja light practice
              capture "$udid" pro landscape ja light lists
            fi
            xcrun simctl shutdown "$udid"
          done
          ls -l screenshots
      # The artifact storage is not reachable from every reviewer's environment, so the screenshots are also printed
      # into the log as small JPEGs (base64, one line each, after "SCREENSHOT <name>").
      - name: Print screenshots
        if: always()
        working-directory: ios
        run: |
          mkdir -p small
          for file in screenshots/*.png; do
            [ -e "$file" ] || continue
            name=$(basename "$file" .png)
            sips -s format jpeg -s formatOptions 55 -Z 1400 "$file" --out "small/$name.jpg" >/dev/null
            echo "SCREENSHOT $name $(base64 -i "small/$name.jpg" | tr -d '\n')"
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipad-screenshots
          path: ios/screenshots
          retention-days: 14
          if-no-files-found: ignore
